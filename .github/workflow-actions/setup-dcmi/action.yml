name: 'Setup DCMI Environment'
description: 'Set up a selected Python version and the DCMI uv environment'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.14'
  locked:
    description: 'Use the committed lockfile without upgrading dependencies'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Print system information
      shell: bash
      run: |
        echo "::group::System information"
        echo "::notice title=Operating system::Linux."
        echo "::notice title=Kernel::$(uname -a)."
        echo "::notice title=Python::$(python --version 2>&1)."
        echo "::endgroup::"

    - name: Install uv
      shell: bash
      run: |
        pipx install uv==0.13.8

    - name: Set up virtual environment
      shell: bash
      run: |
        echo "::group::DCMI environment setup"
        if [ "${{ inputs.locked }}" = "true" ]; then
          echo "UPGRADE=false" >> "$GITHUB_ENV"
          echo "LOCKED=true" >> "$GITHUB_ENV"
          export UPGRADE=false LOCKED=true
        else
          echo "UPGRADE=true" >> "$GITHUB_ENV"
          echo "LOCKED=false" >> "$GITHUB_ENV"
          export UPGRADE=true LOCKED=false
        fi
        make setup-venv
        echo "::endgroup::"
