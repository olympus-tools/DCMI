[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcmi"
description = "*.dcm file interface"
readme = "README.md"
authors = [
  {name = "Andrä Carotta"},
  {name = "Jonas Bleich"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13.7,<3.15"
keywords = ["dcm"]
classifiers = [
    # Intended Audience
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",

    # Topic
    "Topic :: Scientific/Engineering",

    # Programming Language
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",

    # Operating System
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",

    # Environment
    "Environment :: Console",
]

dependencies = [
    "typeguard>=4.6.0",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
dev = [
    "ruff>=0.17.6",
    "pyright>=1.1.414",
    "build>=1.6.1",
    "twine>=7.0.0",
    "gitpython>=3.2.1",
    "pip-licenses>=5.5.5",
    "pipdeptree>=4.2.15",
    "dcmi[test]",
]
docs = []
release = [
    "dcmi[dev]",
    "dcmi[docs]",
]

[project.urls]
"Homepage" = "https://github.com/olympus-tools/DCMI"
"Documentation" = "https://github.com/olympus-tools/DCMI#readme"
"Bug Tracker" = "https://github.com/olympus-tools/DCMI/issues"
"Repository" = "https://github.com/olympus-tools/DCMI"
"Changelog" = "https://github.com/olympus-tools/DCMI/releases"
"Source" = "https://github.com/olympus-tools/DCMI"
"Security Policy" = "https://github.com/olympus-tools/DCMI/security/policy"
"Contributing" = "https://github.com/olympus-tools/DCMI/blob/master/CONTRIBUTING.md"

[tool.setuptools.packages.find]
include = ["dcmi*"]

[tool.setuptools.package-data]
dcmi = ["py.typed"]

[tool.setuptools_scm]
write_to = "dcmi/core/version.py"
fallback_version = "0.0.1"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = [
    "--ignore=test/examples",
]

[tool.ruff]
# The maximum line length.
line-length = 88
# The target Python version.
target-version = "py313"
# Excluded files and directories.
exclude = [
    "ares/core/version.py",
    "packages",
    "submodules",
    ".venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# The preferred quote style.
quote-style = "double"
# The preferred indentation style.
indent-style = "space"

[tool.pyright]
# Pyright will analyze files in this directory.
include = ["dcmi", "test"]

[tool.uv]
python-preference = "system"
python-downloads = "manual"
